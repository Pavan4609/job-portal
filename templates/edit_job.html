<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Job - JobPortal</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #172554;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            font-size: 24px;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 9px 13px;
            border-radius: 6px;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.15);
        }

        .logout {
            background: #dc2626;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .form-card {
            background: white;
            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #172554;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {

            border-color: #2563eb;

        }

        textarea {

            min-height: 160px;

            resize: vertical;

        }

        .row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

        }

        .salary-row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

        }

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 25px;

        }

        button {

            border: none;

            padding: 13px 25px;

            border-radius: 7px;

            font-weight: bold;

            font-size: 15px;

            cursor: pointer;

        }

        .update-btn {

            background: #2563eb;

            color: white;

        }

        .update-btn:hover {

            background: #1d4ed8;

        }

        .cancel-btn {

            background: #e5e7eb;

            color: #222;

            text-decoration: none;

            padding: 13px 25px;

            border-radius: 7px;

        }

        .cancel-btn:hover {

            background: #d1d5db;

        }

        .required {

            color: red;

        }

        @media (max-width: 700px) {

            .navbar {

                flex-direction: column;

                gap: 15px;

                padding: 18px 20px;

            }

            .nav-links {

                flex-wrap: wrap;

                justify-content: center;

            }

            .row,
            .salary-row {

                grid-template-columns: 1fr;

            }

            .container {

                width: 94%;

            }

            .form-card {

                padding: 25px 20px;

            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<div class="navbar">

    <h2>JobPortal</h2>

    <div class="nav-links">

        <a href="{{ url_for('employer') }}">
            Dashboard
        </a>

        <a href="{{ url_for('my_jobs') }}">
            My Jobs
        </a>

        <a href="{{ url_for('logout') }}"
           class="logout">
            Logout
        </a>

    </div>

</div>


<!-- FORM -->

<div class="container">

    <div class="form-card">

        <h1>
            Edit Job
        </h1>

        <p class="subtitle">
            Update your job posting details.
        </p>


        <form method="POST"
              onsubmit="return validateForm()">


            <!-- JOB TITLE -->

            <div class="form-group">

                <label>
                    Job Title
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="title"
                    id="title"
                    value="{{ job.title }}"
                    required
                >

            </div>


            <!-- COMPANY -->

            <div class="form-group">

                <label>
                    Company Name
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="company"
                    id="company"
                    value="{{ job.company }}"
                    required
                >

            </div>


            <!-- LOCATION -->

            <div class="form-group">

                <label>
                    Location
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="location"
                    id="location"
                    value="{{ job.location }}"
                    required
                >

            </div>


            <!-- JOB TYPE + EXPERIENCE -->

            <div class="row">


                <div class="form-group">

                    <label>
                        Job Type
                    </label>

                    <select name="job_type">

                        <option value="Full Time"
                            {% if job.job_type == "Full Time" %}selected{% endif %}>
                            Full Time
                        </option>

                        <option value="Part Time"
                            {% if job.job_type == "Part Time" %}selected{% endif %}>
                            Part Time
                        </option>

                        <option value="Internship"
                            {% if job.job_type == "Internship" %}selected{% endif %}>
                            Internship
                        </option>

                        <option value="Contract"
                            {% if job.job_type == "Contract" %}selected{% endif %}>
                            Contract
                        </option>

                        <option value="Remote"
                            {% if job.job_type == "Remote" %}selected{% endif %}>
                            Remote
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Experience
                    </label>

                    <select name="experience">

                        <option value="Fresher"
                            {% if job.experience == "Fresher" %}selected{% endif %}>
                            Fresher
                        </option>

                        <option value="0-1 Years"
                            {% if job.experience == "0-1 Years" %}selected{% endif %}>
                            0-1 Years
                        </option>

                        <option value="1-3 Years"
                            {% if job.experience == "1-3 Years" %}selected{% endif %}>
                            1-3 Years
                        </option>

                        <option value="3-5 Years"
                            {% if job.experience == "3-5 Years" %}selected{% endif %}>
                            3-5 Years
                        </option>

                        <option value="5+ Years"
                            {% if job.experience == "5+ Years" %}selected{% endif %}>
                            5+ Years
                        </option>

                    </select>

                </div>


            </div>


            <!-- SALARY -->

            <div class="form-group">

                <label>
                    Salary Range
                </label>

                <div class="salary-row">

                    <input
                        type="number"
                        name="min_salary"
                        id="min_salary"
                        value="{{ job.min_salary or 0 }}"
                        min="0"
                        step="0.01"
                        placeholder="Minimum salary"
                    >

                    <input
                        type="number"
                        name="max_salary"
                        id="max_salary"
                        value="{{ job.max_salary or 0 }}"
                        min="0"
                        step="0.01"
                        placeholder="Maximum salary"
                    >

                </div>

            </div>


            <!-- SALARY DESCRIPTION -->

            <div class="form-group">

                <label>
                    Salary Description
                </label>

                <input
                    type="text"
                    name="salary"
                    value="{{ job.salary or '' }}"
                    placeholder="Example: ₹5 - ₹8 LPA"
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Job Description
                    <span class="required">*</span>
                </label>

                <textarea
                    name="description"
                    id="description"
                    required
                >{{ job.description }}</textarea>

            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    type="submit"
                    class="update-btn">

                    Update Job

                </button>


                <a
                    href="{{ url_for('my_jobs') }}"
                    class="cancel-btn">

                    Cancel

                </a>

            </div>


        </form>

    </div>

</div>


<script>

function validateForm() {

    let title =
        document.getElementById("title").value.trim();

    let company =
        document.getElementById("company").value.trim();

    let location =
        document.getElementById("location").value.trim();

    let description =
        document.getElementById("description").value.trim();

    let minSalary =
        document.getElementById("min_salary").value;

    let maxSalary =
        document.getElementById("max_salary").value;


    if (title.length < 2) {

        alert("Please enter a valid job title.");

        return false;

    }


    if (company.length < 2) {

        alert("Please enter a valid company name.");

        return false;

    }


    if (location.length < 2) {

        alert("Please enter a valid location.");

        return false;

    }


    if (description.length < 20) {

        alert(
            "Job description must contain at least 20 characters."
        );

        return false;

    }


    if (
        minSalary !== "" &&
        maxSalary !== "" &&
        Number(minSalary) > Number(maxSalary)
    ) {

        alert(
            "Minimum salary cannot be greater than maximum salary."
        );

        return false;

    }


    return true;

}

</script>


</body>

</html>
